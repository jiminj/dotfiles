#:schema https://fnox.jdx.dev/schema.json
# Global fnox config: secrets loaded into every interactive shell by
# `eval "$(fnox activate zsh)"` in ~/.zshrc. Values are age-encrypted, so this
# file is safe to commit. The private key is ~/.config/fnox/age.txt (never
# committed; restore it on a new machine with: mise run secrets:setup).
default_provider = "age"

[providers.age]
type = "age"
recipients = ["age19c67fjy5u6gylrtnk0mehryntmmaua3pkwr9m7les4pg0jeeufmqlxjh05"]

[secrets]
HOMEBREW_GITHUB_API_TOKEN= { provider = "age", value = "" }
GEMINI_API_KEY= { provider = "age", value = "" }
MAGLEV_API_KEY= { provider = "age", value = "" }
NGC_API_KEY= { provider = "age", value = "" }
NGC_PERSONAL_KEY= { provider = "age", value = "" }
OPENAI_API_KEY= { provider = "age", value = "" }
NVIDIA_NIM_API_KEY= { provider = "age", value = "" }
AIDER_MODEL= { provider = "age", value = "" }
OAI_URL= { provider = "age", value = "" }
OAI_APIKEY= { provider = "age", value = "" }
OAI_MODEL= { provider = "age", value = "" }
NV_INFERENCE_HUB_URL= { provider = "age", value = "" }
NV_INFERENCE_HUB_APIKEY= { provider = "age", value = "" }
SLACK_WEBHOOK_URL= { provider = "age", value = "" }
JENKINS_USER= { provider = "age", value = "" }
JENKINS_API_TOKENS= { provider = "age", value = "" }
ALFRED_API_KEY= { provider = "age", value = "" }
ALFRED_WORKSPACE= { provider = "age", value = "" }
GIT_CRYPT_KEY_B64= { env = false, provider = "age", value = "", description = "git-crypt symmetric key for the yadm dotfiles repo, base64" }
SLACK_USER_OAUTH_TOKEN= { provider = "age", value = "" }
