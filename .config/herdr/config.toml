onboarding = false

[theme]
name = "tokyo-night"
auto_switch = false
custom.selection_bg = "blue"

[advanced]
scrollback_limit_bytes = 100000000

[ui]
prompt_new_tab_name = false

pane_gaps = false
pane_outer_borders = false
pane_borders = true

status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
tab_bar_right = [
  { type = "zoom" },
  { type = "hostname"},
  { type = "datetime", format = "%a %b %d %H:%M"},
  { type = "command", command = "~/.config/herdr/scripts/cpu_info.sh", interval_seconds = 5, timeout_seconds = 2 },
  { type = "command", command = "~/.config/herdr/scripts/ram_info.sh", interval_seconds = 5, timeout_seconds = 2 },
]
tab_bar_right_separator = " | "
tab_bar_position = "bottom"
toast.delivery = "herdr"

sidebar.spaces.rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[keys]
# Tmux-style split window overrides
split_vertical = "prefix+%"
split_horizontal = "prefix+\""
next_tab = ["prefix+n"]
previous_tab = ["prefix+p"]
navigate_workspace_up= ["up", "k"]
navigate_workspace_down = ["down", "j"]
detach = "prefix+d"
next_workspace = ["prefix+shift+n"]
previous_workspace = ["prefix+shift+p"]
new_workspace = ["prefix+shift+c"]
# indexed.workspaces = "ctrl+shift"
next_agent = ["prefix+}"]
previous_agent = ["prefix+{"]
# indexed.agents = "alt+shift"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "hotchpotch.herdr-tiny-fingers.open"
description = "fingers mode"

[[keys.command]]
key = "prefix+ctrl+p"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"
